    <title>レイとルイ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #05081f;
        --bg-2: #0a1030;
        --panel: #101736;
        --panel-2: #171f47;
        --line: #2a3468;
        --ink: #eef1ff;
        --muted: #9aa5cc;
        --gold: #d9a83f;
        --gold-ink: #231a04;
        /* 球体の色（レイ＝青系が初期値。JSで相手ごとに切り替える） */
        --c-hi: #dceaff;
        --c-core: #7fb0ff;
        --c-mid: #3f6fe0;
        --c-deep: #1d3fae;
        --c-glow: rgba(84, 134, 255, 0.55);
      }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
        background:
          radial-gradient(120% 90% at 50% 30%, var(--bg-2) 0%, var(--bg) 62%, #03040f 100%);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        height: 100dvh;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      body.locked { overflow: hidden; }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
      button:focus-visible, textarea:focus-visible, input:focus-visible {
        outline: 2px solid var(--gold); outline-offset: 2px;
      }

      /* ---------- 上部バー ---------- */
      .topbar {
        display: flex; align-items: center; gap: 10px;
        padding: calc(10px + env(safe-area-inset-top)) 14px 8px;
      }
      .icon-btn {
        position: relative;
        width: 46px; height: 46px; flex: 0 0 auto;
        border-radius: 50%;
        background: rgba(23, 31, 71, 0.85);
        border: 1px solid var(--line);
        display: grid; place-items: center;
        color: var(--gold);
      }
      .icon-btn svg { width: 23px; height: 23px; }
      .icon-btn .dot {
        position: absolute; top: 7px; right: 8px;
        width: 9px; height: 9px; border-radius: 50%;
        background: #ff7d9c; border: 2px solid var(--bg);
        display: none;
      }
      .icon-btn .dot.on { display: block; }
      .tabs {
        flex: 1 1 auto; min-width: 0;
        display: flex; gap: 4px;
        background: rgba(16, 23, 54, 0.9);
        border: 1px solid var(--line);
        border-radius: 999px; padding: 4px;
      }
      .tabs button {
        flex: 1 1 0; min-width: 0;
        border-radius: 999px; padding: 9px 4px;
        font-size: 16px; font-weight: 500; color: var(--muted);
        transition: background 0.25s, color 0.25s;
        white-space: nowrap;
      }
      .tabs button[aria-selected="true"] { background: var(--gold); color: var(--gold-ink); font-weight: 700; }
      .top-actions { display: flex; gap: 10px; flex: 0 0 auto; }
      @media (max-width: 430px) {
        .topbar { gap: 7px; padding-left: 10px; padding-right: 10px; }
        .icon-btn { width: 42px; height: 42px; }
        .tabs button { font-size: 15px; }
        .top-actions { gap: 7px; }
      }

      /* ---------- ステージ（球体） ---------- */
      .stage {
        flex: 1 1 auto; min-height: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 26px; padding: 10px 20px calc(18px + env(safe-area-inset-bottom));
      }
      .orb-zone { display: grid; place-items: center; }
      .orb-wrap { will-change: transform; position: relative; }
      .orb-glow {
        position: absolute; inset: -30%;
        border-radius: 50%;
        background: radial-gradient(circle, var(--c-glow) 0%, transparent 62%);
        transition: background 0.6s ease;
        pointer-events: none;
      }
      /* v9：球体の動きはJSエンジン（毎フレーム補間）が担う。CSSキーフレームは使わない */
      .ripple {
        position: absolute; inset: 0; border-radius: 50%;
        border: 2px solid var(--c-hi); opacity: 0; pointer-events: none;
        animation: rippleGo 0.9s ease-out forwards;
      }
      @keyframes rippleGo {
        0% { transform: scale(1); opacity: 0.5; }
        100% { transform: scale(1.45); opacity: 0; }
      }
      .orb {
        position: relative;
        width: min(66vw, 330px); height: min(66vw, 330px);
        border-radius: 50%;
        border: 0; display: block;
        background:
          radial-gradient(circle at 80% 90%, rgba(2, 6, 40, 0.45) 0%, transparent 55%),
          radial-gradient(circle at 22% 12%, rgba(255, 255, 255, 0.32) 0%, transparent 42%),
          radial-gradient(circle at 36% 30%, var(--c-hi) 0%, var(--c-core) 26%, var(--c-mid) 58%, var(--c-deep) 100%);
        box-shadow: 0 0 34px 2px var(--c-glow), 0 0 0 2px rgba(232, 196, 118, var(--rim-op, 0.25));
        transition: background 0.6s ease, box-shadow 0.6s ease;
        overflow: hidden;
      }
      body[data-partner="both"] .orb {
        background:
          radial-gradient(circle at 30% 28%, #dceaff 0%, rgba(127, 176, 255, 0.9) 30%, rgba(127, 176, 255, 0) 62%),
          radial-gradient(circle at 72% 76%, #ffe3d9 0%, rgba(247, 157, 167, 0.95) 34%, rgba(247, 157, 167, 0) 70%),
          radial-gradient(circle at 50% 50%, #8d84e8 0%, #5650b8 58%, #2c2a7a 100%);
      }
      .orb-swirl {
        position: absolute; inset: -12%;
        border-radius: 50%;
        background: conic-gradient(from 0deg,
          transparent 0%, rgba(255, 255, 255, 0.22) 12%, transparent 26%,
          rgba(255, 255, 255, 0.13) 55%, transparent 70%, rgba(255, 255, 255, 0.18) 86%, transparent 100%);
        opacity: 0; transition: opacity 0.4s;
      }
      /* 考え中：内部がゆっくり回転 */
      body[data-state="thinking"] .orb-swirl { opacity: 0.85; animation: spin 7s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .orb-shine {
        position: absolute; left: 16%; top: 10%;
        width: 34%; height: 24%; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0));
        transform: rotate(-18deg);
        pointer-events: none;
      }
      .status { text-align: center; min-height: 52px; padding: 0 12px; }
      .status .state-label { font-size: 17px; font-weight: 500; margin: 0; }
      .status .heard {
        margin: 6px 0 0; font-size: 14px; color: var(--muted);
        min-height: 20px; word-break: break-word;
      }
      .hint { margin: 0; font-size: 12.5px; color: var(--muted); text-align: center; }
      .voice-test-btn {
        border: 1px solid var(--gold); color: var(--gold); background: rgba(16, 23, 54, 0.85);
        border-radius: 999px; padding: 9px 20px; font-size: 14.5px; margin: 2px auto 0;
      }
      .voice-test-btn:active { opacity: 0.7; }
      .plan-strip {
        margin: 0; font-size: 13px; color: var(--ink);
        background: rgba(16, 23, 54, 0.85); border: 1px solid var(--line);
        border-radius: 999px; padding: 8px 16px; text-align: center;
        max-width: 92vw;
      }
      .plan-strip .sep { color: var(--gold); margin: 0 7px; }

      /* ---------- レイヤー（シート） ---------- */
      .scrim {
        position: fixed; inset: 0; background: rgba(2, 4, 18, 0.62);
        opacity: 0; pointer-events: none; transition: opacity 0.25s;
        z-index: 20;
      }
      .scrim.on { opacity: 1; pointer-events: auto; }
      .sheet {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
        max-width: 640px; margin: 0 auto;
        background: var(--panel);
        border: 1px solid var(--line); border-bottom: 0;
        border-radius: 22px 22px 0 0;
        transform: translateY(105%); transition: transform 0.32s cubic-bezier(0.32, 0.72, 0.24, 1);
        max-height: 88dvh;
        display: flex; flex-direction: column;
        padding-bottom: env(safe-area-inset-bottom);
      }
      .sheet.on { transform: translateY(0); }
      .sheet-head {
        display: flex; align-items: center; justify-content: space-between;
        padding: 16px 18px 10px;
      }
      .sheet-head h2 { margin: 0; font-size: 17px; font-weight: 700; }
      .close-btn {
        width: 36px; height: 36px; border-radius: 50%;
        background: var(--panel-2); border: 1px solid var(--line);
        display: grid; place-items: center; color: var(--ink); font-size: 16px;
      }
      .sheet-body { overflow-y: auto; padding: 2px 18px 16px; }
      .card {
        background: var(--panel-2); border: 1px solid var(--line);
        border-radius: 14px; padding: 12px 14px; margin-bottom: 12px;
      }
      .card h3 { margin: 0 0 8px; font-size: 13px; color: var(--gold); font-weight: 700; letter-spacing: 0.04em; }
      .plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; font-size: 14.5px; }
      .plan-grid .k { color: var(--muted); font-size: 12.5px; display: block; margin-bottom: 2px; }
      .plan-grid .wide { grid-column: 1 / -1; }
      .quote { font-size: 14px; line-height: 1.65; margin: 0; }
      .quote .who { font-weight: 700; }
      .quote.rei .who { color: #8db4ff; }
      .quote.rui .who { color: #ffb3c0; }
      .quote.master .who { color: var(--gold); }
      .quote + .quote { margin-top: 6px; }
      .empty-note { font-size: 13.5px; color: var(--muted); margin: 0; }

      /* 会話ログ */
      .messages { display: flex; flex-direction: column; gap: 10px; padding: 4px 0 8px; }
      .msg { max-width: 86%; font-size: 15px; line-height: 1.6; }
      .msg .meta { font-size: 11.5px; color: var(--muted); margin-bottom: 3px; display: flex; gap: 8px; align-items: baseline; }
      .msg .bubble {
        border-radius: 16px; padding: 9px 13px; word-break: break-word; white-space: pre-wrap;
      }
      .msg.master { align-self: flex-end; }
      .msg.master .meta { justify-content: flex-end; }
      .msg.master .bubble { background: var(--gold); color: var(--gold-ink); border-bottom-right-radius: 5px; }
      .msg.rei { align-self: flex-start; }
      .msg.rei .bubble { background: #22377e; border-bottom-left-radius: 5px; }
      .msg.rui { align-self: flex-start; }
      .msg.rui .bubble { background: #6e2f45; border-bottom-left-radius: 5px; }
      .msg .pending-tag { color: #ffb3c0; font-size: 11px; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0 10px; }
      .chips button {
        border: 1px solid var(--line); background: var(--panel-2);
        border-radius: 999px; padding: 7px 13px; font-size: 13.5px; color: var(--ink);
      }
      .chips button:active { background: var(--line); }
      .sheet-foot { border-top: 1px solid var(--line); padding: 10px 14px 12px; }
      .stop-row { display: flex; justify-content: center; margin-bottom: 10px; }
      .stop-btn {
        border: 1px solid #ff7d9c; color: #ffb3c0; border-radius: 999px;
        padding: 7px 16px; font-size: 13.5px;
      }
      .stop-btn[disabled] { opacity: 0.35; border-color: var(--line); color: var(--muted); }
      .input-row { display: flex; gap: 9px; align-items: flex-end; }
      .input-row textarea {
        flex: 1 1 auto; min-width: 0; resize: none;
        background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px;
        color: var(--ink); font: inherit; font-size: 15.5px;
        padding: 10px 12px; max-height: 110px;
      }
      .send-btn {
        flex: 0 0 auto; background: var(--gold); color: var(--gold-ink);

      .key-row input {

      @media (prefers-reduced-motion: reduce) {

    <script>
    (function () {
      'use strict';

      /* ===== 定数 ===== */
      var FEED_URL = 'https://tatuya-st.github.io/threads-auto/state/app_feed.json';
      var INBOX_API = 'https://api.github.com/repos/tatuya-st/threads-auto/contents/state/app_inbox.json';
      var POLL_MS = 4000;
      var SETTINGS_KEY = 'reitorui.settings.v1';
      var LOG_KEY = 'reitorui.log.v1';
      var NAMES = { rei: 'レイ', rui: 'ルイ', both: '2人', master: 'マスター' };
      var ORB_COLORS = {
        rei:  { hi: '#dceaff', core: '#7fb0ff', mid: '#3f6fe0', deep: '#1d3fae', glow: 'rgba(84,134,255,0.55)' },
        rui:  { hi: '#fff0e6', core: '#ffc4b8', mid: '#f78da7', deep: '#c2437f', glow: 'rgba(247,141,167,0.55)' },
        both: { hi: '#e6e2ff', core: '#b3a8f5', mid: '#7a6fd0', deep: '#3d369e', glow: 'rgba(150,130,240,0.5)' }
      };

      /* ===== 状態 ===== */
      var partner = 'rei';
      var orbState = 'idle'; // idle | listening | thinking | speaking
      var messages = [];     // {id, partner, sender, body, ts, pending}
      var settings = { rate: 1.05, continuous: true, apiKey: '' };
      var feedSeen = {};     // フィードで既に見た id
      var feedReady = false; // 初回取得は履歴として取り込むだけ（読み上げない）
      var awaiting = false;  // 返事待ち
      var thinkTimer = null;
      var voiceSession = false; // 球体タップから始まった音声会話中か
      var audioUnlocked = false; // 球体タップで speechSynthesis を解錠済みか（iOS対策）
      var sheetOpen = null;

      /* ===== 要素 ===== */
      function el(id) { return document.getElementById(id); }
      var body = document.body;
      var orbWrap = el('orbWrap'), orbBtn = el('orbBtn');
      var stateLabel = el('stateLabel'), heardLine = el('heardLine');
      var scrim = el('scrim'), chatSheet = el('chatSheet'), settingsSheet = el('settingsSheet');
      var messageList = el('messageList'), textInput = el('textInput');
      var stopSpeakBtn = el('stopSpeakBtn'), toastEl = el('toast');
      var unreadDot = el('unreadDot');

      /* ===== 保存（端末内） ===== */
      function saveSettings() {
        try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
      }
      function loadSettings() {
        try {
          var s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
          if (s) {
            if (typeof s.rate === 'number') settings.rate = s.rate;
            if (typeof s.continuous === 'boolean') settings.continuous = s.continuous;
            if (typeof s.apiKey === 'string') settings.apiKey = s.apiKey;
          }
        } catch (e) {}
      }
      function saveLog() {
        try { localStorage.setItem(LOG_KEY, JSON.stringify(messages.slice(-300))); } catch (e) {}
      }
      function loadLog() {
        try {
          var arr = JSON.parse(localStorage.getItem(LOG_KEY) || '[]');
          if (Array.isArray(arr)) messages = arr.filter(function (m) { return m && m.id && m.body; });
        } catch (e) {}
      }

      /* ===== ユーティリティ ===== */
      function uid() { return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function fmtTime(ts) {
        var d = new Date(ts);
        return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
      }
      var toastTimer = null;
      function toast(text) {
        toastEl.textContent = text;
        toastEl.classList.add('on');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, 3400);
      }
      function b64encode(str) {
        var bytes = new TextEncoder().encode(str);
        var bin = '';
        bytes.forEach(function (b) { bin += String.fromCharCode(b); });
        return btoa(bin);
      }
      function b64decode(b64) {
        var bin = atob(String(b64).replace(/\s/g, ''));
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder().decode(bytes);
      }

      /* ===== 球体の状態 ===== */
      function setOrbState(s) {
        orbState = s;
        body.dataset.state = s;
        var who = NAMES[partner];
        var label = '';
        if (s === 'idle') label = who + 'が待機中';
        else if (s === 'listening') label = who + 'が聞き取り中…';
        else if (s === 'thinking') label = who + 'が考え中…';
        else if (s === 'waiting') label = who + 'の返事を待っています';
        else if (s === 'speaking') label = who + 'がお話し中…';
        stateLabel.textContent = label;
        stopSpeakBtn.disabled = (s !== 'speaking');
      }
      function setPartner(p) {
        partner = p;
        body.dataset.partner = p;
        var c = ORB_COLORS[p];
        var r = document.documentElement.style;
        r.setProperty('--c-hi', c.hi); r.setProperty('--c-core', c.core);
        r.setProperty('--c-mid', c.mid); r.setProperty('--c-deep', c.deep);
        r.setProperty('--c-glow', c.glow);
        var tabs = document.querySelectorAll('.tabs button');
        tabs.forEach(function (b) { b.setAttribute('aria-selected', b.dataset.tab === p ? 'true' : 'false'); });
        if (orbState === 'idle') setOrbState('idle');
        renderMessages();
      }

      /* ===== 今日の作戦 ===== */
      function renderPlan() {
        var now = new Date();
        var week = ['日', '月', '火', '水', '木', '金', '土'][now.getDay()];
        el('planDate').textContent = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日（' + week + '）';
        var start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        var target = new Date(2026, 11, 3);
        var diff = Math.round((target - start) / 86400000);
        el('planDays').textContent = diff > 0 ? 'あと' + diff + '日' : (diff === 0 ? '今日が期限日' : '期限から' + (-diff) + '日経過');
        el('planDuty').textContent = (now.getDate() % 2 === 1) ? 'ルイ' : 'レイ';
      }

      /* ===== 会話の描画 ===== */
      function visibleMessages() {
        return messages.filter(function (m) {
          return partner === 'both' || m.partner === partner || m.partner === 'both';
        });
      }
      function renderMessages() {
        var list = visibleMessages();
        if (!list.length) {
          messageList.innerHTML = '<p class="empty-note">この相手との会話はまだありません。</p>';
        } else {
          messageList.innerHTML = list.map(function (m) {
            var who = NAMES[m.sender] || m.sender;
            var pending = m.pending ? '<span class="pending-tag">送信待ち</span>' : '';
            return '<div class="msg ' + esc(m.sender) + '">' +
              '<div class="meta"><span>' + esc(who) + '</span><span>' + fmtTime(m.ts) + '</span>' + pending + '</div>' +
              '<div class="bubble">' + esc(m.body) + '</div></div>';
          }).join('');
        }
        renderLastExchange();
        var scroller = chatSheet.querySelector('.sheet-body');
        if (sheetOpen === 'chat') scroller.scrollTop = scroller.scrollHeight;
      }
      function renderLastExchange() {
        var box = el('lastExchange');
        var lastUser = null, lastReply = null;
        for (var i = messages.length - 1; i >= 0; i--) {
          if (messages[i].sender === 'master') { lastUser = messages[i]; break; }
        }
        if (lastUser) {
          for (var j = 0; j < messages.length; j++) {
            var m = messages[j];
            if (m.ts >= lastUser.ts && (m.sender === 'rei' || m.sender === 'rui')) { lastReply = m; break; }
          }
        }
        if (!lastUser) {
          box.innerHTML = '<p class="empty-note">まだ会話がありません。球体をタップして話しかけてください。</p>';
          return;
        }
        var html = '<p class="quote master"><span class="who">マスター：</span>' + esc(lastUser.body) + '</p>';
        if (lastReply) {
          html += '<p class="quote ' + lastReply.sender + '"><span class="who">' + NAMES[lastReply.sender] + '：</span>' + esc(lastReply.body) + '</p>';
        } else {
          html += '<p class="empty-note">返事を待っています。</p>';
        }
        box.innerHTML = html;
      }

      /* ===== 音声：読み上げ（日本語・女性ボイス固定／iOS standalone対策） ===== */
      var speakQueue = [];
      var speakingNow = false;
      var stallTimer = null;
      var speakWatchdog = null;
      var currentUtterance = null;
      function pickJaFemaleVoice() {
        var voices = [];
        try { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; } catch (e) {}
        var ja = voices.filter(function (v) { return v.lang && v.lang.toLowerCase().indexOf('ja') === 0; });
        if (!ja.length) return null;
        var male = /keita|otoya|hattori|ichiro|male/i;
        var pref = ['Nanami', 'Kyoko', 'Google 日本語', 'Ayumi', 'Haruka', 'Sayaka'];
        for (var i = 0; i < pref.length; i++) {
          var hit = ja.filter(function (v) { return v.name.indexOf(pref[i]) >= 0; })[0];
          if (hit) return hit;
        }
        var female = ja.filter(function (v) { return !male.test(v.name); })[0];
        return female || ja[0];
      }
      if ('speechSynthesis' in window) {
        speechSynthesis.onvoiceschanged = function () { pickJaFemaleVoice(); };
      }
      /* 声一覧が空の間は voiceschanged を待つ（最大約1.6秒で次へ進む） */
      function ensureVoicesReady(cb) {
        if (!('speechSynthesis' in window)) { cb(); return; }
        var voices = [];
        try { voices = speechSynthesis.getVoices(); } catch (e) {}
        if (voices && voices.length) { cb(); return; }
        var finished = false;
        function finish() { if (finished) return; finished = true; cb(); }
        try {
          if (speechSynthesis.addEventListener) {
            var handler = function () {
              var v = [];
              try { v = speechSynthesis.getVoices(); } catch (e) {}
              if (v && v.length) {
                try { speechSynthesis.removeEventListener('voiceschanged', handler); } catch (e) {}
                finish();
              }
            };
            speechSynthesis.addEventListener('voiceschanged', handler);
          }
        } catch (e) {}
        var prev = null;
        try { prev = speechSynthesis.onvoiceschanged; } catch (e) {}
        try {
          speechSynthesis.onvoiceschanged = function (ev) {
            if (typeof prev === 'function') { try { prev(ev); } catch (e) {} }
            var v2 = [];
            try { v2 = speechSynthesis.getVoices(); } catch (e) {}
            if (v2 && v2.length) finish();
          };
        } catch (e) {}
        setTimeout(finish, 1600);
      }
      /* 1. 音声のアンロック：球体タップ処理の中でだけ呼ぶ。音量0の短い発話で解錠する */
      function unlockAudio() {
        if (audioUnlocked) return;
        if (!('speechSynthesis' in window)) { audioUnlocked = true; return; }
        try {
          if (speechSynthesis.paused) speechSynthesis.resume();
          var dummy = new SpeechSynthesisUtterance('あ');
          dummy.lang = 'ja-JP';
          dummy.volume = 0;
          dummy.rate = 1;
          dummy.pitch = 1;
          var dv = pickJaFemaleVoice();
          if (dv) dummy.voice = dv;
          dummy.onend = function () {};
          dummy.onerror = function () {};
          speechSynthesis.speak(dummy);
        } catch (e) {}
        audioUnlocked = true;
      }
      /* 2. 未アンロック時の表示：読み上げを試みず、タップを促す */
      function refreshLockedNotice() {
        if (audioUnlocked || !speakQueue.length) return;
        if (orbState === 'thinking' && !awaiting) setOrbState('idle');
        if (orbState === 'thinking') {
          // 返事待ち表示と競合しないよう、まず待機へ戻してから案内を出す
          setOrbState('idle');
        }

      /* v5：自然な声の音声ファイルを再生する（機械音声の読み上げは予備に回す） */
      var AUDIO_BASE = 'https://tatuya-st.github.io/threads-auto/state/audio/';
      var currentAudio = null;
      var lastSpokenItem = null;
      function startSpeakItem(item) {
        speakingNow = true;
        setOrbState('speaking');
        if (item.audio) { lastSpokenItem = item; playAudioItem(item); return; }
        /* v8：音声ファイルが無い返事は機械音声で読まない。音声の到着を待ってから読む

        item.retryCount = (item.retryCount || 0) + 1;

          setOrbState(awaiting ? 'waiting' : 'idle');
          pollFeed();
          setTimeout(function () { pumpSpeak(); }, 6000);
          return;
        }

      }
      /* v8：音声コマンドの確認クリップを再生する */
      function playUiClip(name) {
        try {
          if (currentAudio) { try { currentAudio.pause(); } catch (e) {} }
          var a = new Audio(AUDIO_BASE + name);
          currentAudio = a;
          a.onended = function () { if (currentAudio === a) currentAudio = null; };
          var p = a.play();
          if (p && p.catch) p.catch(function () {});
        } catch (e) {}
      }
      /* v11：音声は Pages の反映を待たず、GitHub API から直接受け取る（キーが無い時だけ Pages） */
      var FEED_API = 'https://api.github.com/repos/tatuya-st/threads-auto/contents/state/app_feed.json';
      var AUDIO_API = 'https://api.github.com/repos/tatuya-st/threads-auto/contents/state/audio/';
      var audioUrls = {};
      function fetchAudioBlob(name) {
        if (!settings.apiKey) return null;
        return fetch(AUDIO_API + name, { headers: ghHeaders() }).then(function (res) {
          if (!res.ok) throw new Error('audio api ' + res.status);
          return res.json();
        }).then(function (j) {
          var bin = atob(String(j.content || '').replace(/\s/g, ''));
          var bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          var url = URL.createObjectURL(new Blob([bytes], { type: 'audio/mpeg' }));

        }).catch(function () { return null; });

        if (audioUrls[item.audio]) { startAudioElement(item, audioUrls[item.audio], false); return; }
        var pr = fetchAudioBlob(item.audio);
        if (pr && pr.then) {
          pr.then(function (u) {
            if (!speakingNow) return;
            if (u) startAudioElement(item, u, false);
            else startAudioElement(item, AUDIO_BASE + item.audio, true);
          });
          return;
        }
        startAudioElement(item, AUDIO_BASE + item.audio, true);
      }
      /* v13：音声ファイルが読めない時は、もう一方の経路で1回だけ取り直す。
         それでも駄目なら機械音声には絶対に逃がさず、無音で終える（マスター指示） */
      function audioLoadFailed(item) {
        if (!item.altTried) {
          item.altTried = true;
          var alt = item.audio ? (AUDIO_BASE + item.audio) : null;
          if (alt) { startAudioElement(item, alt, true); return; }
        }

        finishSpeaking();
      }
      function startAudioElement(item, src, useCors) {
        try {
          if (currentAudio) { try { currentAudio.pause(); } catch (e) {} }
          var a = new Audio(src);
          if (useCors) a.crossOrigin = 'anonymous';
          currentAudio = a;
          hookVoiceAnalyser(a);
          clearTimeout(speakWatchdog);
          speakWatchdog = setTimeout(function () {
            if (!speakingNow) return;
            try { a.pause(); } catch (e) {}
            finishSpeaking();

          a.onended = function () { if (currentAudio === a) currentAudio = null; finishSpeaking(); };
          a.onerror = function () {

            clearTimeout(speakWatchdog); speakWatchdog = null;
            audioLoadFailed(item);

          if (p && p.catch) p.catch(function () {
            if (currentAudio === a) currentAudio = null;

      function finishSpeaking() {
        clearTimeout(stallTimer); stallTimer = null;
        clearTimeout(speakWatchdog); speakWatchdog = null;

        if (speakQueue.length && audioUnlocked) { pumpSpeak(); return; }
        // 開始・終了・失敗のいずれでも固まらないよう必ず戻す（返事待ちなら waiting、考え中には戻さない）
        setOrbState(awaiting ? 'waiting' : 'idle');
        stopSpeakBtn.disabled = true;
        // 連続会話：読み終わったら続けて聞き取り（既存の動きを維持）
        if (settings.continuous && voiceSession && !awaiting) {
          setTimeout(function () { if (voiceSession && orbState === 'idle') startListening(); }, 350);
        }
      }
      function attemptSpeak(item, isRetry) {
        if (!speakingNow) return;
        var started = false;
        var u = null;
        try { u = new SpeechSynthesisUtterance(item.text); } catch (e) { finishSpeaking(); return; }
        currentUtterance = u;
        u.lang = 'ja-JP';
        u.rate = settings.rate;
        u.pitch = item.who === 'rui' ? 1.25 : 1.0;
        u.volume = 1;
        var v = pickJaFemaleVoice();
        if (v) u.voice = v;
        clearTimeout(stallTimer);
        /* 4. 詰まり対策：onstart が約2秒以内に来なければ cancel して1回だけ再試行 */
        stallTimer = setTimeout(function () {
          if (started) return;
          try { u.onstart = null; u.onend = null; u.onerror = null; } catch (e) {}
          if (currentUtterance === u) currentUtterance = null;
          try { speechSynthesis.cancel(); } catch (e) {}
          if (!isRetry) {
            setTimeout(function () { if (speakingNow) attemptSpeak(item, true); }, 140);
          } else {
            finishSpeaking();
          }
        }, 2000);
        /* v4：onend が来ない端末不具合でもお話し中で固まらないよう、長さに応じた上限で必ず終える */
        clearTimeout(speakWatchdog);
        speakWatchdog = setTimeout(function () {
          if (!speakingNow) return;
          try { speechSynthesis.cancel(); } catch (e) {}
          finishSpeaking();

        u.onstart = function () { started = true; clearTimeout(stallTimer); stallTimer = null; };
        u.onend = function () {
          clearTimeout(stallTimer); stallTimer = null;
          if (!speakingNow) return;
          if (currentUtterance === u) currentUtterance = null;
          finishSpeaking();
        };
        u.onerror = function (ev) {
          clearTimeout(stallTimer); stallTimer = null;
          if (!speakingNow) return;
          if (currentUtterance !== u) return;

          if (err === 'interrupted' || err === 'canceled') { finishSpeaking(); return; }

            setTimeout(function () { if (speakingNow) attemptSpeak(item, true); }, 140);

          if (speechSynthesis.paused) speechSynthesis.resume();

        } catch (e) {

          else finishSpeaking();

      }
      function pumpSpeak() {
        if (speakingNow || !speakQueue.length) return;
        if (!audioUnlocked) { refreshLockedNotice(); return; }
        var item = speakQueue.shift();
        /* v5：音声ファイルがあればそれを再生、無ければ端末の読み上げで読む */
        try { if ('speechSynthesis' in window) speechSynthesis.getVoices(); } catch (e) {}
        startSpeakItem(item);
      }
      /* タップの中で直接読む（テストボタン・球体の溜まった返事の先頭用）。
         キューも非同期待ちも経由せず、そのタップ処理の中で speak() を呼ぶのが iOS 対策の要 */
      function speakDirect(text, who) {
        if (!('speechSynthesis' in window)) { stateLabel.textContent = 'この端末では読み上げが使えません'; return; }
        try { speechSynthesis.cancel(); } catch (e) {}
        speakQueue = [];
        speakingNow = true;
        setOrbState('speaking');
        audioUnlocked = true;
        attemptSpeak({ text: text, who: who || 'rei' }, false);
      }
      function stopSpeech() {
        speakQueue = [];
        speakingNow = false;
        clearTimeout(stallTimer); stallTimer = null;
        clearTimeout(speakWatchdog); speakWatchdog = null;
        currentUtterance = null;
        if (currentAudio) { try { currentAudio.pause(); } catch (e) {} currentAudio = null; }
        voiceSession = false;
        try { speechSynthesis.cancel(); } catch (e) {}
        if (orbState === 'speaking') setOrbState(awaiting ? 'waiting' : 'idle');
        stopSpeakBtn.disabled = true;
      }

      /* ===== 音声：聞き取り（Web Speech API + マイク音量） ===== */
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
      var recognition = null;
      var micStream = null, micCtx = null, micRAF = null, micLevel = 0;

      function startVolumeMeter() {
        orbWrap.classList.remove('no-volume');
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          orbWrap.classList.add('no-volume');
          return;
        }
        navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
          if (orbState !== 'listening') { stream.getTracks().forEach(function (t) { t.stop(); }); return; }

          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) { orbWrap.classList.add('no-volume'); return; }
          micCtx = new AC();
          var src = micCtx.createMediaStreamSource(stream);
          var analyser = micCtx.createAnalyser();
          analyser.fftSize = 512;

            if (orbState !== 'listening') return;

            var sum = 0;
            for (var i = 0; i < buf.length; i++) { var d = (buf[i] - 128) / 128; sum += d * d; }

      }

      /* v8：音声コマンド。短い発話で、相手の切り替え・停止・再生を声だけで行う */
      function handleVoiceCommand(text) {
        var t = String(text || '').replace(/\s/g, '');
        if (t.length > 14) return false;
        var cmd = null;
        if (/^(止めて|とめて|ストップ|静かにして)$/.test(t)) cmd = 'stop';
        else if (/もう一度/.test(t)) cmd = 'replay';
        else if (/(ふたり|二人|両方)/.test(t) && /(代わ|かわ|切替|切り替|して|お願い)/.test(t)) cmd = 'both';
        else if (/ルイ/.test(t) && /(代わ|かわ|切替|切り替|して|お願い)/.test(t)) cmd = 'rui';
        else if (/レイ/.test(t) && /(代わ|かわ|切替|切り替|して|お願い)/.test(t)) cmd = 'rei';
        if (!cmd) return false;
        if (cmd === 'stop') { stopSpeech(); playUiClip(partner === 'rui' ? 'ui-yes-rui.mp3' : 'ui-yes-rei.mp3'); return true; }
        if (cmd === 'replay') {
          if (lastSpokenItem) { voiceSession = true; audioUnlocked = true; startSpeakItem(lastSpokenItem); }
          return true;
        }
        setPartner(cmd === 'both' ? 'both' : cmd);
        playUiClip(cmd === 'rui' ? 'ui-yes-rui.mp3' : 'ui-yes-rei.mp3');
        toast(cmd === 'both' ? '2人に切り替えました' : (cmd === 'rui' ? 'ルイに切り替えました' : 'レイに切り替えました'));
        return true;
      }

      function startListening() {
        if (!SR) {

          openSheet('chat');

        if (speakingNow || speakQueue.length) stopSpeech();

          if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {

      }

      /* ===== 送信（GitHubリレー：app_inbox.json へ追記） ===== */
      function addLocalMessage(msg) {
        messages.push(msg);
        messages.sort(function (a, b) { return a.ts - b.ts; });
        saveLog();
        renderMessages();
      }
      function markDelivered(id) {

          /* v4：考え中は最大25秒まで。それを過ぎたら「返事を待っています」表示に切り替え、
             固まって見えないようにする。返事の受信確認は裏で続く */
          thinkTimer = setTimeout(function () {

            }

          }, 25000);

      }
      function sendUserMessage(text) {
        text = (text || '').trim();
        if (!text) return;
        var msg = { id: uid(), partner: partner, sender: 'master', body: text, ts: Date.now(), pending: true };
        addLocalMessage(msg);
        heardLine.textContent = '';

      function flushPending() {

        var entry = { id: msg.id, partner: msg.partner, body: msg.body, ts: msg.ts };

          if (res.status === 404) return { sha: null, data: { messages: [] } };
          if (!res.ok) throw new Error('GET ' + res.status);

      /* ===== 受信（app_feed.json をポーリング） ===== */
      function pollFeed() {

        if (settings.apiKey) {
          fetch(FEED_API, { headers: ghHeaders() }).then(function (res) {
            if (!res.ok) throw new Error('feed api ' + res.status);
            return res.json();
          }).then(function (j) {
            var data = { messages: [] };
            try { data = JSON.parse(b64decode(j.content || '')); } catch (e) {}
            handleFeedData(data);
          }).catch(function () { pollFeedPages(); });
          return;
        }
        pollFeedPages();
      }
      function pollFeedPages() {
        fetch(FEED_URL + '?t=' + Date.now(), { cache: 'no-store' }).then(function (res) {
          if (!res.ok) throw new Error('feed ' + res.status);
          return res.json();
        }).then(function (data) { handleFeedData(data); }).catch(function () {});
      }
      function handleFeedData(data) {
          el('syncInfo').textContent = '返事の受信： ' + fmtTime(Date.now()) + ' に確認済み（数秒ごとに自動確認）';
          var arr = (data && Array.isArray(data.messages)) ? data.messages : [];
          var fresh = [];
          arr.forEach(function (fm) {
            if (!fm || !fm.id || feedSeen[fm.id]) return;
            feedSeen[fm.id] = true;
            var known = messages.some(function (m) { return m.id === fm.id; });
            if (!known && (fm.sender === 'rei' || fm.sender === 'rui')) {
              fresh.push({ id: fm.id, partner: fm.partner || 'both', sender: fm.sender, body: String(fm.body || ''), ts: fm.ts || Date.now(), pending: false, audio: fm.audio || null });
            }

          if (fresh.length) {
            fresh.forEach(function (m) { messages.push(m); });
            messages.sort(function (a, b) { return a.ts - b.ts; });
            saveLog();
            renderMessages();
            if (feedReady) {
              rimUntil = Date.now() + 700; /* v9：返事が届いたら金の縁が一瞬光る */
              if (awaiting) setAwaiting(false);
              if (sheetOpen !== 'chat') unreadDot.classList.add('on');
              if (settings.continuous) {
                fresh.forEach(function (m) {
                  if (m.audio && settings.apiKey) { fetchAudioBlob(m.audio); }
                  else if (m.audio) { try { var pre = new Audio(); pre.preload = 'auto'; pre.src = AUDIO_BASE + m.audio; } catch (e) {} }
                  speak(m.body, m.sender, m.audio);

              } else if (orbState === 'thinking') {
                setOrbState('idle');
              }
            }
          }
          feedReady = true;
      }

      /* ===== レイヤー開閉 ===== */
      function openSheet(which) {
        sheetOpen = which;
        scrim.classList.add('on');
        body.classList.add('locked');
        chatSheet.classList.toggle('on', which === 'chat');
        settingsSheet.classList.toggle('on', which === 'settings');
        chatSheet.setAttribute('aria-hidden', which === 'chat' ? 'false' : 'true');
        settingsSheet.setAttribute('aria-hidden', which === 'settings' ? 'false' : 'true');
        if (which === 'chat') {
          unreadDot.classList.remove('on');
          var scroller = chatSheet.querySelector('.sheet-body');
          scroller.scrollTop = scroller.scrollHeight;
        }
      }
      function closeSheets() {
        sheetOpen = null;
        scrim.classList.remove('on');
        body.classList.remove('locked');
        chatSheet.classList.remove('on');
        settingsSheet.classList.remove('on');
        chatSheet.setAttribute('aria-hidden', 'true');
        settingsSheet.setAttribute('aria-hidden', 'true');
        el('keyNotice').classList.remove('on');
      }
      function openSettings(needKey) {
        el('keyInput').value = settings.apiKey || '';
        el('keyNotice').classList.toggle('on', !!needKey);
        openSheet('settings');
        if (needKey) setTimeout(function () { el('keyInput').focus(); }, 350);
      }

      /* ===== 設定UI ===== */
      function renderSettings() {
        document.querySelectorAll('#rateGroup button').forEach(function (b) {
          b.setAttribute('aria-pressed', parseFloat(b.dataset.rate) === settings.rate ? 'true' : 'false');
        });
        el('continuousSwitch').setAttribute('aria-checked', settings.continuous ? 'true' : 'false');
      }

      /* ===== イベント ===== */
      orbBtn.addEventListener('click', function () {
        if (voiceCtx && voiceCtx.state === 'suspended') { try { voiceCtx.resume(); } catch (e) {} }
        // 割り込み（読み上げ中のタップで停止）は維持する
        if (orbState === 'speaking') {
          unlockAudio();
          stopSpeech();
          return;
        }
        if (orbState === 'listening') { unlockAudio(); voiceSession = false; endListening(); return; }
        // v4：考え中・返事待ちのタップは「返事を今すぐ確認」として働く（固まったままにしない）
        if (orbState === 'thinking' || orbState === 'waiting') {
          unlockAudio();
          pollFeed();
          if (speakQueue.length > 0) {
            voiceSession = true;
            var f2 = speakQueue.shift();
            audioUnlocked = true;
            startSpeakItem(f2);
          } else {
            toast('返事を確認しています');
          }
          return;
        }
        // 溜まっていた返事があれば、聞き取りではなく先に読み上げる。
        // v3：タップ処理の中で直接 speak() する（遅延や無音ダミーを挟まない）
        if (speakQueue.length > 0) {
          voiceSession = true;
          heardLine.textContent = '';
          var first = speakQueue.shift();
          audioUnlocked = true;
          startSpeakItem(first);
          return;
        }
        unlockAudio();
        startListening();
      });
      document.querySelectorAll('.tabs button').forEach(function (b) {
        b.addEventListener('click', function () {
          setPartner(b.dataset.tab);
          /* v10：切り替えた相手の声で短く返事して、切り替わったことを声でも伝える */
          if (audioUnlocked) playUiClip(b.dataset.tab === 'rui' ? 'ui-yes-rui.mp3' : 'ui-yes-rei.mp3');
        });
      });
      el('openChatBtn').addEventListener('click', function () { openSheet('chat'); });
      el('openKeyboardBtn').addEventListener('click', function () { openSheet('chat'); setTimeout(function () { textInput.focus(); }, 350); });
      el('openSettingsBtn').addEventListener('click', function () { openSettings(false); });
      scrim.addEventListener('click', closeSheets);
      document.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', closeSheets); });
      document.querySelectorAll('#chipRow button').forEach(function (b) {
        b.addEventListener('click', function () { sendUserMessage(b.dataset.chip); });
      });
      function doSendFromInput() {
        var t = textInput.value;
        textInput.value = '';
        textInput.style.height = 'auto';
        sendUserMessage(t);
      }
      el('sendBtn').addEventListener('click', doSendFromInput);
      textInput.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); doSendFromInput(); }
      });
      textInput.addEventListener('input', function () {
        textInput.style.height = 'auto';
        textInput.style.height = Math.min(textInput.scrollHeight, 110) + 'px';
      });
      stopSpeakBtn.addEventListener('click', stopSpeech);
      el('voiceTestBtn').addEventListener('click', function () {
        // v10：テスト音声は今選んでいる相手の声で再生する（ルイ選択中はルイの声）
        voiceSession = false;
        stopSpeech();
        audioUnlocked = true;
        speakingNow = true;
        setOrbState('speaking');
        if (partner === 'rui') {
          playAudioItem({ text: 'こんにちは、マスター。ルイです。声のテストをしています。この声、どうですか？', who: 'rui', audio: 'test-voice-rui.mp3' });
        } else {
          playAudioItem({ text: 'こんにちは、マスター。レイです。声のテストをしています。この声、どうですか？', who: 'rei', audio: 'test-voice.mp3' });
        }
      });
      document.querySelectorAll('#rateGroup button').forEach(function (b) {
        b.addEventListener('click', function () {
          settings.rate = parseFloat(b.dataset.rate);
          saveSettings(); renderSettings();
          toast('読み上げ速度を ' + b.dataset.rate + ' にしました');
        });
      });
      el('continuousSwitch').addEventListener('click', function () {
        settings.continuous = !settings.continuous;
        saveSettings(); renderSettings();
        toast('連続会話を ' + (settings.continuous ? 'ON' : 'OFF') + ' にしました');
      });
      el('keySaveBtn').addEventListener('click', function () {
        var v = el('keyInput').value.trim();
        if (!v) { toast('接続キーが入力されていません'); return; }
        settings.apiKey = v;
        saveSettings();
        el('keyNotice').classList.remove('on');
        toast('接続キーを保存しました');
        flushPending();
      });
      el('keyClearBtn').addEventListener('click', function () {
        settings.apiKey = '';
        el('keyInput').value = '';
        saveSettings();
        toast('接続キーを消しました');
      });
      document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeSheets(); });
      document.addEventListener('visibilitychange', function () { if (!document.hidden) pollFeed(); });

      /* ===== 初期化 ===== */
      loadSettings();
      loadLog();
      messages.forEach(function (m) { if (m.sender !== 'master') feedSeen[m.id] = true; });
      renderSettings();
      renderPlan();
      setPartner('rei');
      renderMessages();
      setOrbState('idle');
      /* 声一覧を早めに読み込んでおく（タップ時に待たないため） */
      try { if ('speechSynthesis' in window) { speechSynthesis.getVoices(); } } catch (e) {}
      /* v4：版の自己確認。サーバ側の版と違えば古いキャッシュで動いていると分かる */
      try {
        fetch('https://tatuya-st.github.io/threads-auto/state/app_version.json?t=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) {
            if (j && j.version && j.version !== 'v13') {
              el('versionLine').textContent = '新しい版（' + j.version + '）があります。アプリを完全に閉じて開き直してください';
              el('versionLine').style.color = '#ffd479';
            }
          }).catch(function () {});
      } catch (e) {}
      pollFeed();
      setInterval(pollFeed, POLL_MS);
      setInterval(renderPlan, 60000);
    })();
    </script>
  </body>
</html>
