name: Threadsの情報収集
on:
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: threads-search
  cancel-in-progress: false
jobs:
  comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: どの鍵が入っているか
        run: echo "::notice::THREADS=${{ secrets.THREADS != '' }} THREADS_ACCESS_TOKEN=${{ secrets.THREADS_ACCESS_TOKEN != '' }} TOKEN=${{ secrets.TOKEN != '' }} THREADS_TOKEN=${{ secrets.THREADS_TOKEN != '' }}"
      - name: 伸びている投稿を集める
        env:
          THREADS_TOKEN: ${{ secrets.THREADS || secrets.THREADS_ACCESS_TOKEN || secrets.TOKEN || secrets.THREADS_TOKEN }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET || secrets.KEY }}
          TOKEN2: ${{ secrets.TOKEN }}
        run: python3 tools/publish.py search
      - name: 保存
        run: |
          git config user.name "threads-bot"; git config user.email "threads-bot@users.noreply.github.com"
          git add state/search.json
          git diff --cached --quiet || (git commit -qm "情報収集の記録" && git pull -q --rebase && git push -q)
      - name: 失敗をGitHubアプリに知らせる
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/alert.sh "⚠️ Threadsの情報収集ができませんでした" "threads_keyword_search の許可が無いか、トークンの問題です。"
