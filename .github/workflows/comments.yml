name: コメントの確認
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: threads-comments
  cancel-in-progress: false
jobs:
  comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 返信待ちのコメントを集める
        env:
          THREADS_TOKEN: ${{ secrets.THREADS || secrets.THREADS_ACCESS_TOKEN || secrets.TOKEN || secrets.THREADS_TOKEN }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET || secrets.KEY }}
          TOKEN2: ${{ secrets.TOKEN }}
        run: python3 tools/publish.py comments
      - name: 保存
        run: |
          git config user.name "threads-bot"; git config user.email "threads-bot@users.noreply.github.com"
          git add state/comments.json state/status.txt
          # 11/13 Issue #39：status.txt の競合で止まらないよう、自分の新しい記録を優先して3回までやり直す
          git diff --cached --quiet || { git commit -qm "コメントの記録"; ok=0; for i in 1 2 3; do if git pull -q --rebase -X theirs && git push -q; then ok=1; break; fi; git rebase --abort 2>/dev/null; sleep 5; done; [ $ok = 1 ]; }
      - name: 失敗をGitHubアプリに知らせる
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/alert.sh "⚠️ コメントを確認できませんでした" "原因は詳細のログを見てください（許可・トークン・記録ファイルのどれか）。ルイが確認します。"
