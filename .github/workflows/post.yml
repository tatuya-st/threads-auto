name: Threadsに投稿
on:
  push:
    branches: [main]
    paths: ['queue/**']
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: threads
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 準備（画像ライブラリとフォント）
        run: |
          pip install -q pillow
          mkdir -p fonts
          for f in zenkakugothicnew/ZenKakuGothicNew-Bold.ttf zenkakugothicnew/ZenKakuGothicNew-Medium.ttf delagothicone/DelaGothicOne-Regular.ttf; do
            [ -s fonts/$(basename $f) ] || curl -sSfL -o fonts/$(basename $f) https://github.com/google/fonts/raw/main/ofl/$f
          done
      - name: 画像を作る
        run: |
          for q in queue/*.json; do
            id=$(basename "$q" .json)
            grep -q '"kind": "talk"' "$q" && continue
            [ -f "state/posted/$id.json" ] || [ -f "images/$id.png" ] || python tools/render.py "$q" "images/$id.png"
          done
      - name: 画像を公開する
        run: |
          git config user.name "threads-bot"; git config user.email "threads-bot@users.noreply.github.com"
          git add images fonts
          git diff --cached --quiet || (git commit -qm "画像を追加" && (git push -q || (git pull -q --rebase && git push -q)))
          sleep 5
      - name: 投稿時間（反応が良い時間帯を数字から選ぶ）
        if: github.event_name == 'push'
        run: |
          n=0; for q in queue/*.json; do [ -f "state/posted/$(basename "$q")" ] || n=1; done
          [ $n = 1 ] || { echo "新しい投稿なし（返信だけ）なので待たない"; exit 0; }
          out=$(python tools/timing.py)
          echo "$out" | head -n -1
          sleep $(echo "$out" | tail -1)
      - name: Threadsに投稿
        env:
          THREADS_TOKEN: ${{ secrets.THREADS || secrets.THREADS_ACCESS_TOKEN || secrets.TOKEN || secrets.THREADS_TOKEN }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET || secrets.KEY }}
          TOKEN2: ${{ secrets.TOKEN }}
        run: python tools/publish.py publish
      - name: 記録を保存
        if: always()
        run: |
          git add state
          git diff --cached --quiet || (git commit -qm "投稿の記録" && git pull -q --rebase && git push -q)
      - name: 失敗をGitHubアプリに知らせる
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/alert.sh "⚠️ Threadsに投稿できませんでした" "投稿の処理が失敗しました。ルイが次の実行で原因を確認します。"
