<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>許可コード｜便利アプリ</title>
<style>body{font-family:sans-serif;max-width:560px;margin:0 auto;padding:32px 16px;line-height:1.8;background:#17131c;color:#efe9f3;text-align:center}
#c{word-break:break-all;background:#221c29;border:1px solid #ec6b95;border-radius:12px;padding:14px;font-size:14px;margin:16px 0}
button{font-size:18px;font-weight:700;padding:14px 28px;border-radius:12px;border:0;background:#ec6b95;color:#fff}</style></head><body>
<h1 style="font-size:22px">許可できました</h1>
<p id="m">下のボタンでコードをコピーして、Claudeに送ってください。</p>
<div id="c"></div>
<button id="b" type="button">コピーする</button>
<script>
var q=new URLSearchParams(location.search),c=(q.get('code')||'').replace(/#_$/,'');
document.getElementById('c').textContent=c||'コードがありません。最初からやり直してください。';
document.getElementById('b').onclick=function(){navigator.clipboard.writeText(c).then(function(){document.getElementById('b').textContent='コピーしました'})};
</script></body></html>
